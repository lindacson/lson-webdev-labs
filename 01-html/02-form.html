<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Exercise 02 - Form</title>
  </head>
  <body>
    <main>
      <!-- Add your code here -->
      <h1>Roth IRA Calculator</h1>
      <form method="post" action="/submitform">
        <div>
          <label for="balance">Balance ($)</label><br>
          <input type="text" id="balance" name="balance">
        </div>
        <br>
        <div>
          <label for="annual">Annual contribution (4)</label><br>
          <input type="text" id="annual" name="annual">
        </div>
        <br>
        <fieldset>
          <legend>Maximize contributions?</legend>
          <input type="radio" name="maximize" id="yes" value="yes">
          <label for="yes">Yes</label>
          <input type="radio" name="maximize" id="no" value="no">
          <label for="no">No</label>
        </fieldset>
        <br>
        <div>
          <label for="rate">Expected rate of return (5)</label><br>
          <input type="number" name="rate" id="rate">
        </div>
        <br>
        <div>
          <label for="cage">Current age</label><br>
          <input type="number" name="cage" id="cage">
        </div>
        <br>
        <div>
          <label for="rage">Retirement age</label><br>
          <input type="number" name="rage" id="rage">
        </div>
        <br>
        <div>
          <label for="tax">Marginal tax rate (%)</label><br>
          <input type="number" name="tax" id="tax">
        </div>
        <br>
        <div>
          <input type="submit" value="Calculate">
          <input type="reset" value="Reset">
        </div>
      </form>
      <p>This exercise is a simplified version of the Roth IRA Calculator at <a href="https://www.calculator.net/">Calculator.net</a></p>
    </main>
  </body>
</html>
